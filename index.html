<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Todo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f0f2f5;
    display: flex;
    justify-content: center;
    padding: 60px 20px;
    min-height: 100vh;
  }
  .app {
    width: 100%;
    max-width: 480px;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 2px 16px rgba(0,0,0,0.08);
    padding: 32px;
    align-self: flex-start;
  }
  h1 {
    font-size: 24px;
    font-weight: 700;
    color: #1a1a1a;
    margin-bottom: 24px;
  }
  .input-row {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
  }
  .input-row input {
    flex: 1;
    padding: 10px 14px;
    border: 1.5px solid #e0e0e0;
    border-radius: 8px;
    font-size: 15px;
    outline: none;
    transition: border-color 0.15s;
  }
  .input-row input:focus { border-color: #4f46e5; }
  .input-row button {
    padding: 10px 20px;
    background: #4f46e5;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
    white-space: nowrap;
  }
  .input-row button:hover { background: #4338ca; }
  .filters {
    display: flex;
    gap: 6px;
    margin-bottom: 16px;
  }
  .filters button {
    flex: 1;
    padding: 7px 0;
    border: 1.5px solid #e0e0e0;
    background: #fff;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
    color: #666;
    transition: all 0.15s;
  }
  .filters button.active {
    background: #4f46e5;
    color: #fff;
    border-color: #4f46e5;
  }
  .todo-list {
    list-style: none;
    margin-bottom: 16px;
  }
  .todo-list li {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 0;
    border-bottom: 1px solid #f0f0f0;
  }
  .todo-list li:last-child { border-bottom: none; }
  .todo-list input[type="checkbox"] {
    width: 18px; height: 18px;
    accent-color: #4f46e5;
    cursor: pointer;
    flex-shrink: 0;
  }
  .todo-list .text {
    flex: 1;
    font-size: 15px;
    color: #1a1a1a;
    word-break: break-all;
  }
  .todo-list li.completed .text {
    text-decoration: line-through;
    color: #aaa;
  }
  .todo-list .del {
    background: none;
    border: none;
    color: #ccc;
    font-size: 18px;
    cursor: pointer;
    padding: 2px 6px;
    line-height: 1;
    transition: color 0.15s;
    flex-shrink: 0;
  }
  .todo-list .del:hover { color: #e53e3e; }
  .footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    color: #888;
  }
  .footer button {
    background: none;
    border: none;
    color: #888;
    font-size: 13px;
    cursor: pointer;
    transition: color 0.15s;
  }
  .footer button:hover { color: #e53e3e; }
  .empty {
    text-align: center;
    color: #bbb;
    font-size: 14px;
    padding: 40px 0;
  }
</style>
</head>
<body>
<div class="app">
  <h1>Todo</h1>
  <div class="input-row">
    <input id="input" type="text" placeholder="添加新任务..." maxlength="200">
    <button id="addBtn">添加</button>
  </div>
  <div class="filters">
    <button data-filter="all" class="active">全部</button>
    <button data-filter="active">未完成</button>
    <button data-filter="completed">已完成</button>
  </div>
  <ul class="todo-list" id="list"></ul>
  <div class="footer">
    <span id="counter"></span>
    <button id="clearCompleted">清除已完成</button>
  </div>
</div>

<script>
  const input = document.getElementById('input');
  const addBtn = document.getElementById('addBtn');
  const list = document.getElementById('list');
  const counter = document.getElementById('counter');
  const clearBtn = document.getElementById('clearCompleted');
  const filterBtns = document.querySelectorAll('.filters button');

  let todos = JSON.parse(localStorage.getItem('todos') || '[]');
  let filter = 'all';

  function save() { localStorage.setItem('todos', JSON.stringify(todos)); }

  function render() {
    const filtered = filter === 'all'
      ? todos
      : filter === 'active'
        ? todos.filter(t => !t.done)
        : todos.filter(t => t.done);

    list.innerHTML = '';

    if (filtered.length === 0) {
      list.innerHTML = '<div class="empty">暂无任务</div>';
    } else {
      filtered.forEach(todo => {
        const li = document.createElement('li');
        if (todo.done) li.className = 'completed';

        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.checked = todo.done;
        cb.addEventListener('change', () => {
          todo.done = cb.checked;
          save();
          render();
        });

        const span = document.createElement('span');
        span.className = 'text';
        span.textContent = todo.text;

        const del = document.createElement('button');
        del.className = 'del';
        del.textContent = '×';
        del.addEventListener('click', () => {
          todos = todos.filter(t => t.id !== todo.id);
          save();
          render();
        });

        li.append(cb, span, del);
        list.appendChild(li);
      });
    }

    const activeCount = todos.filter(t => !t.done).length;
    counter.textContent = activeCount + ' 项未完成';
  }

  function addTodo() {
    const text = input.value.trim();
    if (!text) return;
    todos.push({ id: Date.now(), text, done: false });
    input.value = '';
    save();
    render();
  }

  addBtn.addEventListener('click', addTodo);
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') addTodo();
  });

  filterBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      filterBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filter = btn.dataset.filter;
      render();
    });
  });

  clearBtn.addEventListener('click', () => {
    todos = todos.filter(t => !t.done);
    save();
    render();
  });

  render();
</script>
</body>
</html>
